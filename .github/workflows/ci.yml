name: CI — Lint, Type Check, Build, Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # 🔒 V26 Phase 7: Prisma generate MUST run before tsc/build — without it,
      # the Prisma client is stale and tsc shows phantom errors.
        run: npx prisma generate

      - name: Run ESLint
        # 🔒 2026-08-03 (audit): was `npx next lint` with continue-on-error.
        # `next lint` was REMOVED in Next 16 — the command parsed "lint" as a
        # directory name and exited 1 every single run. continue-on-error meant
        # nobody ever saw it, so this repo has had a lint step that never once
        # linted anything. A gate that always passes is not a gate.
        # `npm run lint` is `eslint .`, which works. Blocking: application
        # source is clean today, so an error here is a genuine new problem.
        run: npm run lint

      - name: Type check the E2E suite
        # tsconfig.json EXCLUDES e2e/, so the main tsc never saw these files. A
        # wrong Prisma field name there compiled fine and failed ten minutes
        # later inside a CI run. Seconds here instead. (#22, 2026-08-13)
        run: npx tsc -p tsconfig.e2e.json --noEmit

      - name: Run TypeScript type check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
        # BLOCKING — type errors indicate real bugs and must not reach production.

      - name: Run Jest tests
        run: npx jest
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
        # BLOCKING — unit tests must pass before merge.

      - name: Build Next.js project
        run: npx next build
        env:
          # 🔒 V26 Phase 7: Use dummy values for CI build — Next.js build doesn't
          # connect to the DB, it just compiles. Real secrets are only needed
          # at runtime (Vercel handles that).
          NEXTAUTH_SECRET: 'ci-build-dummy-secret'
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          NEXTAUTH_URL: 'http://localhost:3000'

  # 🔒 2026-08-13 (#22): this job now runs on PUSH as well as on pull requests,
  # and against a REAL database.
  #
  # It was gated to `pull_request` only. Everything in this repo is pushed
  # straight to main, so it had never once run — and it could not have passed if
  # it had. Two faults kept it inert:
  #
  #   1. DATABASE_URL was `file:./e2e-test.db`, a SQLite path against a Postgres
  #      schema. Nothing could connect.
  #   2. No test user was ever created. e2e/fixtures.ts said so in its own
  #      comment — "For CI, we'd create this user in a global setup script" —
  #      and that script did not exist.
  #
  # Proven, not assumed: run locally as CI would, all 8 tests failed at the same
  # point (setting up `loggedInPage`). A suite that cannot pass anywhere looked
  # like coverage for months.
  #
  # A Postgres service + the real migrations is the only honest way to run these:
  # a fake database tests the fake database.
  e2e-tests:
    runs-on: ubuntu-latest
    needs: quality-check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ekbook_e2e
        ports:
          - 5432:5432
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ekbook_e2e'
      DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/ekbook_e2e'
      NEXTAUTH_SECRET: 'e2e-test-secret'
      NEXTAUTH_URL: 'http://localhost:3000'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        # `migrate deploy`, not `db push` — the migrations are the thing that
        # owns the schema, and running them here also proves they still apply.
        run: npx prisma migrate deploy

      # The E2E account is seeded by Playwright's globalSetup
      # (e2e/seed-e2e-user.ts), not by a step here — a step can be reordered or
      # forgotten, and the failure then looks like a broken app.

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
